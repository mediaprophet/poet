name: Build Webizen Poet .qap Package

on:
  push:
    branches: ["main", "0.0.41-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-poet-qap:
    name: Compile & Verify poet.qap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Webizen Poet
        uses: actions/checkout@v4

      - name: Compile poet.qap via qap-compiler
        uses: mediaprophet/qap-compiler@main
        with:
          workspace-dir: "."
          output-qap: "dist/poet.qap"
          principal-did: "did:webizen:person:timothy-holborn"
          compatibility-mode: "minor-update"
          artifact-name: "poet-qap-package"

      - name: Checkout qap-compiler for Debian profile checks
        uses: actions/checkout@v4
        with:
          repository: mediaprophet/qap-compiler
          path: .qap-compiler

      - name: Verify six Debian native profiles
        run: |
          cargo build --release --manifest-path .qap-compiler/Cargo.toml -p qapc-cli \
            --target-dir .qap-compiler/target-debian-profiles
          QAPC=.qap-compiler/target-debian-profiles/release/qapc
          for p in host desktop subsystem mobile iot-headless iot-display; do
            echo "::group::qapc check-env --profile $p"
            "$QAPC" check-env . exact --profile "$p"
            echo "::endgroup::"
          done

