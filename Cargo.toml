[workspace]
members = [
    "native",
    "wasm",
    "mobile-wasm",
    "crates/geometry",
    "crates/spatial-authoring",
    "crates/poet-aether-ui",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ciborium = "0.2.2"
uuid = { version = "1.24", features = ["v4", "js"] }
chrono = { version = "0.4.45", default-features = false }
console_error_panic_hook = "0.1.7"
base64 = { version = "0.22.1", default-features = false }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"
vibe = { git = "https://github.com/mediaprophet/qualiaDB.git", branch = "0.0.40.12-etalon-migration" }
aether = { git = "https://github.com/mediaprophet/Aether.git", rev = "d5ccce3bb9d6cab2aa5d7ef185d57ad786737c27", default-features = false, features = ["macro", "html", "signals", "hooks"] }
aether-native = { git = "https://github.com/mediaprophet/Aether.git", rev = "d5ccce3bb9d6cab2aa5d7ef185d57ad786737c27", default-features = false, features = ["vello-cpu-softbuffer", "system-fonts", "data-uri", "clipboard", "accessibility"] }
etalon = { git = "https://github.com/mediaprophet/etalon.git", rev = "575bab54accf1aafb24f67e9ba810c0f3f745aea", default-features = false, features = ["std", "wgsl", "serde"] }
etalon-render = { git = "https://github.com/mediaprophet/etalon.git", rev = "575bab54accf1aafb24f67e9ba810c0f3f745aea", default-features = false }
etalon-wgsl-forge = { git = "https://github.com/mediaprophet/etalon.git", rev = "575bab54accf1aafb24f67e9ba810c0f3f745aea", default-features = false }
etalon-nquin = { git = "https://github.com/mediaprophet/etalon.git", rev = "575bab54accf1aafb24f67e9ba810c0f3f745aea", default-features = false }
etalon-tensor = { git = "https://github.com/mediaprophet/etalon.git", rev = "575bab54accf1aafb24f67e9ba810c0f3f745aea", default-features = false }
etalon-wasm = { git = "https://github.com/mediaprophet/etalon.git", rev = "575bab54accf1aafb24f67e9ba810c0f3f745aea", default-features = false }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

[patch.crates-io]
cpal = { git = "https://github.com/mediaprophet/hypermedia-production.git", branch = "0.0.40.8.1" }
wgpu = { git = "https://github.com/mediaprophet/etalon.git", rev = "575bab54accf1aafb24f67e9ba810c0f3f745aea" }
naga = { git = "https://github.com/mediaprophet/etalon.git", rev = "575bab54accf1aafb24f67e9ba810c0f3f745aea" }
