[workspace]
members = [
    "native",
    "wasm",
    "mobile-wasm",
    "crates/geometry",
    "crates/spatial-authoring",
    "crates/poet-aether-ui",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ciborium = "0.2.2"
uuid = { version = "1.24", features = ["v4", "js"] }
chrono = { version = "0.4.45", default-features = false }
console_error_panic_hook = "0.1.7"
base64 = { version = "0.22.1", default-features = false }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"
vibe = { path = "../qualiaDB/crates/vibe" }
aether = { path = "../Aether/packages/aether", default-features = false, features = ["macro", "html", "signals", "hooks"] }
aether-native = { path = "../Aether/packages/native", default-features = false, features = ["vello-cpu-softbuffer", "system-fonts", "data-uri", "clipboard", "accessibility"] }
etalon = { path = "../etalon/etalon", default-features = false, features = ["std", "wgsl", "serde"] }
etalon-render = { path = "../etalon/crates/etalon-render", default-features = false }
etalon-wgsl-forge = { path = "../etalon/crates/etalon-wgsl-forge", default-features = false }
etalon-nquin = { path = "../etalon/crates/etalon-nquin", default-features = false }
etalon-tensor = { path = "../etalon/crates/etalon-tensor", default-features = false }
etalon-wasm = { path = "../etalon/crates/etalon-wasm", default-features = false }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

[patch.crates-io]
blitz-traits = { path = "../Aether/vendor/blitz/blitz-traits" }
blitz-dom = { path = "../Aether/vendor/blitz/blitz-dom" }
blitz-net = { path = "../Aether/vendor/blitz/blitz-net" }

[patch."https://github.com/mediaprophet/etalon.git"]
etalon = { path = "../etalon/etalon" }
etalon-render = { path = "../etalon/crates/etalon-render" }
etalon-vibe = { path = "../etalon/crates/etalon-vibe" }
etalon-nquin = { path = "../etalon/crates/etalon-nquin" }
etalon-resources = { path = "../etalon/crates/etalon-resources" }
etalon-sense-core = { path = "../etalon/crates/etalon-sense-core" }
etalon-signal = { path = "../etalon/crates/etalon-signal" }
etalon-tensor = { path = "../etalon/crates/etalon-tensor" }
etalon-wasm = { path = "../etalon/crates/etalon-wasm" }
etalon-wgsl-forge = { path = "../etalon/crates/etalon-wgsl-forge" }

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "../qualiaDB/crates/vibescript-abi" }

[patch."https://github.com/mediaprophet/hypermedia-production.git"]
vector-hybrid-render-adapter = { path = "../hypermedia-production/crates/vector-hybrid-render-adapter" }
gpu-device-context = { path = "../hypermedia-production/crates/gpu-device-context" }
