[package]
name = "poet-aether-ui"
version = "0.0.40"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
description = "Poet HyperCanvas — Standalone Aether UI Workbench (Desktop & WASM)"

[dependencies]
aether = { workspace = true, features = ["macro", "html", "signals", "hooks", "mounted", "document"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
vibe = { workspace = true }
etalon-render = { workspace = true }
etalon-wgsl-forge = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
qualia-core-db = { git = "https://github.com/mediaprophet/qualiaDB.git", branch = "0.0.40.12-etalon-migration", default-features = false, features = ["profile_target_1024", "zk-culling", "gpu-runtime", "gpu-native-portable", "gpu-native-dx12", "wgsl-forge", "privacy-he", "sanctuary-crypto"], optional = true }
webizen-render = { git = "https://github.com/mediaprophet/qualiaDB.git", branch = "0.0.40.12-etalon-migration", optional = true }
aether-native = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "Storage",
    "Clipboard",
    "Navigator",
] }

[features]
default = []
desktop = ["aether/desktop"]
web = ["aether/web"]
native = ["aether/native"]
native-engine = ["dep:qualia-core-db", "dep:webizen-render", "etalon-render/gpu", "etalon-wgsl-forge/naga-validate"]
desktop-native = ["dep:aether-native"]
