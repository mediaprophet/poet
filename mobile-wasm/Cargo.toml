[package]
name = "poet-mobile-wasm"
version = "0.0.40"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
description = "Poet HyperCanvas Mobile WASM — Touch-First Spatial Hypermedia & Radial Workbench"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
poet = { path = "../wasm" }
poet-aether-ui = { path = "../crates/poet-aether-ui" }
vibe = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
] }
