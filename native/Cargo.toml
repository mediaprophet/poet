[package]
name = "poet-cli"
version = "0.0.41"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
description = "Webizen Poet — Standalone Native HyperCanvas Workbench, Ontology & WordNet Studio, Forensic Link-Analysis, and Verifiable PDF Report Printer"
autoexamples = false

[dependencies]
vibe = { workspace = true }
poet-aether-ui = { path = "../crates/poet-aether-ui" }
aether = { workspace = true, optional = true, features = ["html", "hooks", "macro", "signals"] }
aether-native = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }

[features]
default = []
native-graphical = [
    "dep:aether",
    "dep:aether-native",
    "poet-aether-ui/desktop-native",
    "dep:serde",
    "dep:serde_json",
    "dep:ciborium",
]

[[bin]]
name = "poet"
path = "src/main.rs"

[dev-dependencies]
ciborium.workspace = true
tempfile = "=3.27.0"
