<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QualiaDB UI Preview — Tool-Chest & Manifolds</title>
  <meta name="author" content="Timothy Charles Holborn">
  <meta name="copyright" content="Copyright (c) 2026 Timothy Charles Holborn. All rights reserved.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #07090e; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; color: #6b7689; font-family: 'Inter', sans-serif; font-size: 14px;
    }
  </style>
  <link data-trunk rel="rust" data-bin="qualia-ui" />
</head>
<body>
  <script>
    // Error catchers — must be first to catch WASM init failures
    window.addEventListener('error', (e) => {
      console.error('[html] window error:', e.error || e.message, e.filename, e.lineno);
      const el = document.getElementById('loading');
      if (el && !document.querySelector('.app')) {
        const msg = e.error ? String(e.error) : (e.message || 'Unknown error');
        el.innerHTML = '<div style="color:#ff4444;font-family:monospace;font-size:12px;padding:20px;max-width:600px;">' +
          '<h3 style="margin:0 0 10px;">Qualia UI — Window Error</h3>' +
          '<pre style="white-space:pre-wrap;word-break:break-all;">' + msg.replace(/</g,'&lt;').replace(/>/g,'&gt;') +
          '\n\nat ' + (e.filename||'') + ':' + (e.lineno||'') + '</pre></div>';
        el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;';
      }
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('[html] unhandled rejection:', e.reason);
      const el = document.getElementById('loading');
      if (el && !document.querySelector('.app')) {
        el.innerHTML = '<div style="color:#ff4444;font-family:monospace;font-size:12px;padding:20px;max-width:600px;">' +
          '<h3 style="margin:0 0 10px;">Qualia UI — WASM Init Error</h3>' +
          '<pre style="white-space:pre-wrap;word-break:break-all;">' + String(e.reason).replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre>' +
          '</div>';
        el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;';
      }
    });
    console.log('[html] error listeners installed');
  </script>
  <div id="loading">Loading QualiaDB UI…</div>
  <script type="module">
    // Fallback: if app doesn't appear within 10s, show error
    setTimeout(() => {
      if (!document.querySelector('.app')) {
        const el = document.getElementById('loading');
        if (el) {
          el.innerHTML = '<div style="color:#ff4444;font-family:monospace;font-size:12px;padding:20px;max-width:600px;">' +
            '<h3 style="margin:0 0 10px;">Qualia UI — Timeout</h3>' +
            '<p>WASM did not initialize within 10 seconds. Check browser console (F12) for errors.</p>' +
            '</div>';
          el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;';
        }
      }
    }, 10000);

    // Check for app readiness
    function checkReady() {
      if (document.querySelector('.app')) {
        document.getElementById('loading')?.remove();
      } else {
        requestAnimationFrame(checkReady);
      }
    }
    requestAnimationFrame(checkReady);

    // Listen for TrunkApplicationStarted event to debug
    window.addEventListener('TrunkApplicationStarted', (e) => {
      console.log('[html] TrunkApplicationStarted', e.detail);
      // Manually call start() since we removed #[wasm_bindgen(start)]
      if (window.wasmBindings && window.wasmBindings.start) {
        console.log('[html] calling start()');
        try {
          window.wasmBindings.start();
        } catch (err) {
          console.error('[html] start() threw:', err);
          const el = document.getElementById('loading');
          if (el) {
            el.innerHTML = '<div style="color:#ff4444;font-family:monospace;font-size:12px;padding:20px;max-width:600px;">' +
              '<h3 style="margin:0 0 10px;">Qualia UI — start() Error</h3>' +
              '<pre style="white-space:pre-wrap;word-break:break-all;">' + String(err).replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre>' +
              '</div>';
            el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;';
          }
        }
      } else {
        console.error('[html] wasmBindings.start not found!', window.wasmBindings);
      }
    });
  </script>
</body>
</html>
